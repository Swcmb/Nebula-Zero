***REMOVED*** Nebula Zero 部署编排
***REMOVED***
***REMOVED*** 用法：
***REMOVED***   cp deploy/.env.example deploy/.env   ***REMOVED*** 填入自己的密钥
***REMOVED***   docker compose -f deploy/docker-compose.yml up -d
***REMOVED***
***REMOVED*** 本文件是脱敏后的生产配置模板：所有密码/密钥均为占位符，
***REMOVED*** 真实值只存在于服务器的 .env，不进版本库。

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ***REMOVED*** 只绑回环，不对公网暴露裸 HTTP。
    ***REMOVED*** 公网入口一律走 caddy 的 443（HTTPS）。若这里写 '3000:3000'，
    ***REMOVED*** 任何人都能用明文抓到你的账号密码和 API Key，HTTPS 就白配了。
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - SESSION_SECRET=${SESSION_SECRET}
      - CRYPTO_SECRET=${CRYPTO_SECRET}
      - TZ=${TZ:-Asia/Shanghai}
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - SYNC_FREQUENCY=60
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: new-api
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=100
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d new-api']
      interval: 10s
      timeout: 5s
      retries: 5

  ***REMOVED*** 上游适配器，4 实例轮询：单实例在实测中频繁 429/502，不可压容。
  ***REMOVED*** 省略其余 3 个实例，按同一模式复制。
  oc2api-1:
    image: ghcr.io/jasonxu114514/opencode2api:latest
    container_name: oc2api-1
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
    environment:
      - OC2API_KEY=${OC2API_KEY}
      - TZ=${TZ:-Asia/Shanghai}
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O - http://localhost:8080/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_data:

  ***REMOVED*** Caddy：自动签发并续期 Let's Encrypt 证书，把 443 的 HTTPS 转给 new-api。
  ***REMOVED***
  ***REMOVED*** 为什么需要它：Let's Encrypt 不签发「IP 地址证书」，
  ***REMOVED*** 但签发形如 <IP>.sslip.io 的域名证书（sslip.io 是把 IP 反解成域名的公开服务）。
  ***REMOVED*** 有域名就不需要这层；没有域名时它是唯一能在浏览器里拿到受信任证书的办法。
  ***REMOVED***
  ***REMOVED*** 启动前先把它接进 new-api 的网络，否则按容器名反代会解析失败：
  ***REMOVED***   docker network connect new-api_default caddy
  ***REMOVED*** 挂载的 Caddyfile 用 CADDY_DOMAIN 占位，首次部署时替换成你的实际域名。
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on:
      new-api:
        condition: service_started
    ports:
      - '80:80' ***REMOVED*** ACME 验证 + 跳转 HTTPS
      - '443:443'
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data ***REMOVED*** 证书与私钥，删了这个 volume 就要重新签发
      - caddy-config:/config
    ***REMOVED*** 服务器内存只有 1.6G，给 Caddy 设上限，别让它被 OOM 干掉连累 new-api
    mem_limit: 128m