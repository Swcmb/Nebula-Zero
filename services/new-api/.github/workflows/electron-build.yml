name: Build Electron App

on:
  push:
    tags:
      - '*'  ***REMOVED*** Triggers on version tags like v1.0.0
      - '!*-*'  ***REMOVED*** Ignore pre-release tags like v1.0.0-beta
      - '!*-alpha*' ***REMOVED*** Ignore alpha tags like v1.0.0-alpha
  workflow_dispatch:  ***REMOVED*** Allows manual triggering

jobs:
  build:
    strategy:
      matrix:
        ***REMOVED*** os: [macos-latest, windows-latest]
        os: [windows-latest]

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 ***REMOVED*** v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 ***REMOVED*** v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e ***REMOVED*** v6.4.0
        with:
          node-version: '22'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 ***REMOVED*** v6.5.0
        with:
          go-version: '>=1.26'

      - name: Build frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION=$(git describe --tags) bun run build
          cd ..

      ***REMOVED*** - name: Build Go binary (macos/Linux)
      ***REMOVED***   if: runner.os != 'Windows'
      ***REMOVED***   run: |
      ***REMOVED***     go mod download
      ***REMOVED***     go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(git describe --tags)' -extldflags '-static'" -o new-api

      - name: Build Go binary (Windows)
        if: runner.os == 'Windows'
        run: |
          go mod download
          go build -pgo="$(go list -m -f '{{.Dir}}' github.com/Calcium-Ion/moejs)/default.pgo" -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$(git describe --tags)'" -o new-api.exe

      - name: Update Electron version
        run: |
          cd electron
          VERSION=$(git describe --tags)
          VERSION=${VERSION***REMOVED***v}  ***REMOVED*** Remove 'v' prefix if present
          ***REMOVED*** Convert to valid semver: take first 3 components and convert rest to prerelease format
          ***REMOVED*** e.g., 0.9.3-patch.1 -> 0.9.3-patch.1
          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(.*)$ ]]; then
            MAJOR=${BASH_REMATCH[1]}
            MINOR=${BASH_REMATCH[2]}
            PATCH=${BASH_REMATCH[3]}
            REST=${BASH_REMATCH[4]}
          
            VERSION="$MAJOR.$MINOR.$PATCH"
          
            ***REMOVED*** If there's extra content, append it without adding -dev
            if [[ -n "$REST" ]]; then
              VERSION="$VERSION$REST"
            fi
          fi
          npm version $VERSION --no-git-tag-version --allow-same-version

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install

      ***REMOVED*** - name: Build Electron app (macOS)
      ***REMOVED***   if: runner.os == 'macOS'
      ***REMOVED***   run: |
      ***REMOVED***     cd electron
      ***REMOVED***     npm run build:mac
      ***REMOVED***   env:
      ***REMOVED***     CSC_IDENTITY_AUTO_DISCOVERY: false  ***REMOVED*** Skip code signing

      - name: Build Electron app (Windows)
        if: runner.os == 'Windows'
        run: |
          cd electron
          npm run build:win

      ***REMOVED*** - name: Upload artifacts (macOS)
      ***REMOVED***   if: runner.os == 'macOS'
      ***REMOVED***   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a ***REMOVED*** v7.0.1
      ***REMOVED***   with:
      ***REMOVED***     name: macos-build
      ***REMOVED***     path: |
      ***REMOVED***       electron/dist/*.dmg
      ***REMOVED***       electron/dist/*.zip

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a ***REMOVED*** v7.0.1
        with:
          name: windows-build
          path: |
            electron/dist/*.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c ***REMOVED*** v8.0.1

      - name: Upload to Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b ***REMOVED*** v3.0.1
        with:
          files: |
            windows-build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
