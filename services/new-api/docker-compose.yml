    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api ***REMOVED*** ⚠️ IMPORTANT: Change the password in production!
***REMOVED***      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  ***REMOVED*** Point to the mysql service, uncomment if using MySQL
***REMOVED***      - LOG_SQL_DSN=postgresql://root:123456@postgres:5432/new-api-log ***REMOVED*** OPTIONAL: If you want a separate database for logging, uncomment and set this
***REMOVED***      - LOG_SQL_DSN=clickhouse://default:123456@clickhouse:9000/new_api_logs ***REMOVED*** OPTIONAL: Use ClickHouse for logs only; also uncomment clickhouse in depends_on and the clickhouse service below
***REMOVED***      - LOG_SQL_CLICKHOUSE_TTL_DAYS=0 ***REMOVED*** OPTIONAL: ClickHouse log retention days. Unset or 0 disables automatic deletion; set to e.g. 30 to keep 30 days
      - REDIS_CONN_STRING=redis://:123456@redis:6379 ***REMOVED*** ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true ***REMOVED*** 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  ***REMOVED*** 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  ***REMOVED*** 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
***REMOVED***      - DEFAULT_LANGUAGE=zh-CN  ***REMOVED*** 默认语言：日志输出，以及对方没有指定语言时返回的提示、邮件和通知；可选 en、zh-CN、zh-TW，不设置为 en (Default language of logs and of messages, emails and notifications when the reader states none: en, zh-CN or zh-TW; en if unset)
***REMOVED***      - STREAMING_TIMEOUT=300  ***REMOVED*** 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
***REMOVED***      - RELAY_IDLE_CONN_TIMEOUT=90  ***REMOVED*** Relay HTTP 客户端空闲连接超时时间，单位秒，默认跟随 Go 标准库，设置为0表示不限制 (Relay HTTP client idle keep-alive timeout in seconds, defaults to Go standard library; set 0 to disable)
***REMOVED***      - SESSION_SECRET=random_string  ***REMOVED*** 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
***REMOVED***      - SESSION_COOKIE_SECURE=true  ***REMOVED*** true：启用 Secure Refresh Cookie 和严格 refresh/logout OriginGuard；false/未配置：关闭 OriginGuard，仅用于本地 HTTP (true: Secure cookie + strict refresh/logout OriginGuard; false/unset: guard disabled for local HTTP only)
***REMOVED***      - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com  ***REMOVED*** Secure=true 时必填的精确 HTTPS Origin；不是 relay CORS 白名单，不支持通配符/路径 (Required exact HTTPS origins when Secure=true; not a relay CORS allowlist, no wildcard/path)
***REMOVED***      - TRUSTED_PROXIES=172.20.0.0/16  ***REMOVED*** 未配置时信任回环/RFC1918/fc00::/7 并告警，none 为严格模式，显式列表替代默认值 (Unset trusts loopback/RFC 1918/fc00::/7 with a warning; none trusts no proxies; an explicit list replaces defaults)
***REMOVED***      - USER_SESSION_ACTIVE_LIMIT=50
***REMOVED***      - USER_SESSION_ISSUANCE_LIMIT=100
***REMOVED***      - USER_SESSION_ISSUANCE_WINDOW_SECONDS=86400  ***REMOVED*** 不得大于 revoked 保留期 (must not exceed revoked retention)
***REMOVED***      - USER_SESSION_REVOKED_RETENTION_DAYS=7
***REMOVED***      - USER_SESSION_HOURLY_ALERT_THRESHOLD=5000  ***REMOVED*** 仅告警，不做全局拒绝 (alert only; never globally rejects login)
***REMOVED***      - SYNC_FREQUENCY=60  ***REMOVED*** Uncomment if regular database syncing is needed
***REMOVED***      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  ***REMOVED*** Google Analytics 的测量 ID (Google Analytics Measurement ID)
